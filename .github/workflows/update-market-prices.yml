name: Update Egyptian market prices

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled jobs by a few minutes during busy periods.
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Egyptian market prices
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          source = 'https://goldpricestoday.net/api/v1/egypt.json'
          request = urllib.request.Request(
              source,
              headers={
                  'accept': 'application/json',
                  'user-agent': 'Mozilla/5.0 (compatible; Ma3akKamPriceUpdater/1.0)',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          gold = {
              str(karat): {
                  'gram': values.get('gram'),
                  'price': values.get('gram'),
                  'updatedAt': payload.get('updated'),
              }
              for karat, values in payload.get('prices', {}).items()
              if isinstance(values, dict) and values.get('gram') is not None
          }
          fx = payload.get('fx', {})
          data = {
              'schemaVersion': 1,
              'provider': 'goldpricestoday',
              'updatedAt': payload.get('updated') or datetime.now(timezone.utc).isoformat(),
              'currency': 'EGP',
              'gold': gold,
              'rates': {'USD': 1, 'EGP': fx.get('rate')} if fx.get('rate') else {},
          }

          target = Path('data/market_prices.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changed prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "chore: update Egyptian market prices"
          git push
